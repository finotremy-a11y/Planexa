# render.yaml — Infrastructure as Code pour Render
services:
  # ── Web Service (Rails) ───────────────────────────────────────────────────
  - type: web
    name: planify-pro-web
    runtime: ruby
    buildCommand: |
      bundle install
      bundle exec rails assets:precompile
      bundle exec rails db:prepare
    startCommand: bundle exec puma -C config/puma.rb
    healthCheckPath: /up
    envVars:
      - key: RAILS_ENV
        value: production
      - key: RAILS_SERVE_STATIC_FILES
        value: true
      - key: RAILS_LOG_TO_STDOUT
        value: true
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: planify-pro-redis
          property: connectionString
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: APP_HOST
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

  # ── Worker Sidekiq ────────────────────────────────────────────────────────
  - type: worker
    name: planify-pro-worker
    runtime: ruby
    buildCommand: bundle install
    startCommand: bundle exec sidekiq
    envVars:
      - key: RAILS_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: planify-pro-redis
          property: connectionString
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false

  # ── Cron Jobs (scheduling via Render, pas de whenever ni solid_queue) ──────
  - type: cron
    name: planify-pro-cron-suspend-overdue
    runtime: ruby
    schedule: "0 6 * * *"   # Chaque jour à 6h00 UTC
    buildCommand: bundle install
    startCommand: bundle exec rails runner "SuspendOverdueCompaniesJob.perform_later"
    envVars:
      - key: RAILS_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: planify-pro-redis
          property: connectionString
      - key: SECRET_KEY_BASE
        generateValue: true

  - type: cron
    name: planify-pro-cron-trial-ending
    runtime: ruby
    schedule: "0 8 * * *"   # Chaque jour à 8h00 UTC
    buildCommand: bundle install
    startCommand: bundle exec rails runner "TrialEndingReminderJob.perform_later"
    envVars:
      - key: RAILS_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: planify-pro-redis
          property: connectionString
      - key: SECRET_KEY_BASE
        generateValue: true

  - type: cron
    name: planify-pro-cron-weekly-perf
    runtime: ruby
    schedule: "30 8 * * 1"  # Chaque lundi à 8h30 UTC
    buildCommand: bundle install
    startCommand: bundle exec rails runner "WeeklyCompanyPerformanceEmailJob.perform_later"
    envVars:
      - key: RAILS_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: planify-pro-redis
          property: connectionString
      - key: SECRET_KEY_BASE
        generateValue: true

  # ── Redis ─────────────────────────────────────────────────────────────────
  - type: redis
    name: planify-pro-redis
    plan: starter
    maxmemoryPolicy: noeviction
