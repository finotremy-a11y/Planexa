 payments)","    # Groupdate: appointments by day for the period","    @appointments_by_day = appointments.group_by_day(:scheduled_at, range: @range).count","","    # Groupdate: revenue by week (or by day if 7-day period)","    if @period \u003c= 7","      @revenue_by_period = payments.group_by_day(:paid_at, range: @range).sum(:amount_cents)","                                   .transform_values { |v| (v / 100.0).round(2) }","    else","      @revenue_by_period = payments.group_by_week(:paid_at, range: @range).sum(:amount_cents)","                                   .transform_values { |v| (v / 100.0).round(2) }","    end","  end","","  def build_rankings(appointments)","    @top_services = appointments","      .joins(:service_type)","      .group(\"service_types.name\")","      .order(\"count_all DESC\")","      .limit(5)","      .count","","    @top_employees = appointments","      .joins(:employee)","      .where.not(employee_id: nil)","      .joins(\"JOIN employees ON employees.id = appointments.employee_id\")","      .group(\"employees.first_name || ' ' || employees.last_name\")","      .order(\"count_all DESC\")","      .limit(5)","      .count","  end","end"],"lines":[null,null,0,null,0,0,null,0,0,0,null,0,0,null,0,0,0,0,0,null,null,0,0,0,null,0,null,null,null,null,0,0,null,0,0,null,null,null,null,null,null,0,null,null,null,null,0,0,null,null,null,null,null,0,null,0,0,0,0,0,0,0,null,null,0,0,0,null,null,0,0,0,0,0,0,0,0,null,null,0,0,0,0,null,null,0,null,0,null,null,0,0,0,null,0,0,null,null,null,0,0,null,null,null,null,null,null,0,null,null,null,null,null,null,null,null,null],"lines_covered_percent":0.0,"covered_lines":0,"missed_lines":57,"omitted_lines":60,"total_lines":57},"app/controllers/company/stripe_connects_controller.rb":{"source":["# frozen_string_literal: true","","class Company::StripeConnectsController \u003c Company::BaseController","  def connect","    if @company.stripe_account_id.present?","      account = Stripe::Account.retrieve(@company.stri d_end)","        )","        company.active!","        CompanyMailer.welcome_trial(company).deliver_later if stripe_sub.status == \"trialing\"","","      # ── Paiement réussi ──────────────────────────────────────────────────","      when \"invoice.payment_succeeded\"","        invoice = event.data.object","        return unless invoice.subscription","","        subscription = ::Subscription.find_by(stripe_subscription_id: invoice.subscription)","        return unless subscription","","        subscription.reactivate! if subscription.suspended? || subscription.past_due?","        subscription.update!(","          status:             :active,","          current_period_end: Time.at(invoice.lines.data.first.period.end)","        )","","      # ── Paiement échoué ──────────────────────────────────────────────────","      when \"invoice.payment_failed\"","        invoice = event.data.object","        return unless invoice.subscription","","        subscription = ::Subscription.find_by(stripe_subscription_id: invoice.subscription)","        return unless subscription","","        subscription.update!(status: :past_due)","        CompanyMailer.payment_failed(subscription.company).deliver_later","","      # ── Abonnement annulé ─────────────────────────────────────────────────","      when \"customer.subscription.deleted\"","        stripe_sub   = event.data.object","        subscription = ::Subscription.find_by(stripe_subscription_id: stripe_sub.id)","        return unless subscription","","        subscription.update!(status: :canceled)","        subscription.company.suspended!","        CompanyMailer.subscription_canceled(subscription.company).deliver_later","","      # ── Checkout terminé (récupération stripe_subscription_id) ───────────","      when \"checkout.session.completed\"","        session    = event.data.object","        company_id = session.metadata[\"company_id\"]","        company    = Company.find_by(id: company_id)","        return unless company && session.subscription","","        company.update!(stripe_customer_id: session.customer) if company.stripe_customer_id.blank?","","      # ── Paiement client (Stripe Connect) — confirmation ──────────────────","      when \"payment_intent.succeeded\"","        payment_intent = event.data.object","        payment = Payment.find_by(stripe_payment_intent_id: payment_intent.id)","        return unless payment","        return if payment.succeeded? # Idempotence : déjà traité","","        payment.update!(status: :succeeded, paid_at: Time.current)","        appointment = payment.appointment","        appointment.confirmed!","        ClientMailer.appointment_confirmed(appointment).deliver_later","        CompanyMailer.new_appointment(appointment).deliver_later","        AppointmentReminderJob.set(wait_until: appointment.scheduled_at - 24.hours)","                              .perform_later(appointment.id)","","        # Génération automatique de la facture PDF","        InvoiceGeneratorService.new(payment).call","","      else","        Rails.logger.info \"[Stripe Webhook] Événement non géré: #{event[\"type\"]}\"","      end","    end","  end","end"],"lines":[0,0,null,0,0,null,0,0,0,null,null,0,null,null,null,0,0,null,null,0,0,null,null,0,null,0,0,null,null,null,0,0,0,null,0,0,null,null,null,0,null,null,0,0,null,null,null,0,0,null,0,0,null,0,0,null,null,null,null,null,null,0,0,null,0,0,null,0,0,null,null,null,0,0,0,null,0,0,0,null,null,null,0,0,0,0,null,0,null,null,null,0,0,0,0,null,0,0,0,0,0,0,null,null,null,0,null,null,0,null,null,null,null],"lines_covered_percent":0.0,"covered_lines":0,"missed_lines":58,"omitted_lines":55,"total_lines":58},"app/controllers/waitlist_entries_controller.rb":{"source":["# frozen_string_literal: true","","# Public controller — allows clients to join waitlist and confirm via token","class WaitlistEntriesController \u003c ApplicationController","  skip_before_action :authenticate_user!, only: [ :new, :create, :confirm, :confirmed, :submitted ]","" pp/models/push_subscription.rb":{"source":["## app/models/push_subscription.rb","# Modèle pour gérer les abonnements aux notifications push","# Stocke les endpoints push et les clés d'authentification VAPID","","class PushSubscription \u003c ApplicationRecord","  belongs_to :user","  belongs_to :company","","  validates :endpoint, presence: true, uniqueness: { scope: [:user_id, :company_id] }","  validates :auth, presence: true","  validates :p256dh, presence: true","  validates :user_id, presence: true","  validates :company_id, presence: true","","  # Envoyer une notification push à cet utilisateur","  def send_notification(title:, body:, icon: nil, tag: 'planify-pro', data: {})","    unless Rails.configuration.vapid[:enabled]","      Rails.logger.info(\"Push notifications are disabled: missing VAPID configuration\")","      return","    end","","    WebPush.payload_send(","      endpoint: endpoint,","      message: {","        title: title,","        body: body,","        icon: icon || '/icons/icon-192x192.png',","        badge: '/icons/icon-192x192.png',","        tag: tag,","        data: data","      }.to_json,","      p256dh: p256dh,","      auth: auth,","      vapid: {","        subject: Rails.configuration.vapid[:subject],","        public_key: Rails.configuration.vapid[:public_key],","        private_key: Rails.configuration.vapid[:private_key]","      }","    )","  rescue WebPush::ExpiredSubscription, WebPush::InvalidSubscription => e","    # L'abonnement est expiré ou invalide, le supprimer","    destroy","    Rails.logger.warn(\"Push subscription removed: #{e.message}\")","  rescue => e","    Rails.logger.error(\"Failed to send push notification: #{e.message}\")","  end","","  # Scope: abonnements actifs pour une compagnie","  scope :for_company, ->(company) { where(company_id: company.id) }","  scope :for_user, ->(user) { where(user_id: user.id) }","","  # Scope: abonnements créés récemment","  scope :recent, -> { order(created_at: :desc) }","end"],"li "    # 2. Filtrer ceux qui sont disponibles au créneau demandé","    candidates.select do |employee|","      AvailabilityChecker.new(employee, @scheduled_at, @duration_minutes).available?","    end","  end","","  # Score de charge : nombre de RDV ce jour-là (moins = prioritaire)","  def workload_score(employee)","    employee.appointments","            .where(scheduled_at: @scheduled_at.beginning_of_day..@scheduled_at.end_of_day)","            .where.not(status: [ :cancelled, :no_show ])","            .count","  end","end"],"lines":[0,0,0,0,0,0,null,null,null,0,0,0,null,null,null,null,0,0,null,null,0,null,0,null,0,null,null,null,null,0,0,null,null,null,null,0,0,null,null,null,null,null],"lines_covered_percent":0.0,"covered_lines":0,"missed_lines":18,"omitted_lines":24,"total_lines":18},"app/services/availability_checker.rb":{"source":["class AvailabilityChecker","  def initialize(employee, datetime, duration_minutes, urgent: false)","    @employee         = employee","    @company          = employee.company","    @setting          = @company.setting","    @datetime         = datetime","    @duration_minutes = duration_minutes","    @urgent           = urgent","    @end_datetime     = datetime + duration_minutes.minutes","    @buffer_minutes   = @setting.buffer_between_appointments_minutes.to_i","  end","","  def available?(exclude_appointment_id: nil)","    @exclude_appointment_id = exclude_appointment_id","    within_schedule? && no_conflict? && not_absent? && not_company_closed?","  end","","  private","","  # Vérifie que l'employé n'est pas en absence sur le créneau demandé","  def not_absent?","    @employee.employee_absences","             .covering(@datetime, @end_datetime)","             .none?","  end","","  def not_company_closed?","    @company.company_closures.covering(@datetime, @end_datetime).none?","  end","","  # Vérifie si le créneau est dans les horaires de l'employé","  def within_schedule?","    date       = @datetime.to_date","    day_of_w   = @datetime.wday","    start_time = @datetime.strftime(\"%H:%M\")","    end_time   = @end_datetime.strftime(\"%H:%M\")","","    # Chercher une exception pour ce jour précis","    exception = @employee.schedules","                         .exceptions","                         .for_date(date)","                         .first","","    if exception","      return false unless exception.available?","      return covers_timerange?(exception, start_time, end_time)","    end","","    # Sinon, chercher le créneau récurrent pour ce jour de la semaine","    recurring = @employee.schedules","                         .recurring","                         .for_day(day_of_w)","                         .available","                         .first","","    return false unless recurring","    covers_timerange?(recurring, start_time, end_time)","  end","","  # Vérifie qu'il n'y a pas de chevauchement avec un autre RDV","  def no_conflict?","    overlap_count = overlapping_appointments.count","    return true if overlap_count.zero?","","    overlap_count \u003c= allowed_overbooking_limit","  end","","  def overlapping_appointments","    relation = @employee.appointments","                        .where.not(status: [ :cancelled, :no_show ])","    relation = relation.where.not(id: @exclude_appointment_id) if @exclude_appointment_id.present?","","    relation.select do |appt|","      appointment_end_with_buffer = appt.ends_at + @buffer_minutes.minutes","      requested_end_with_buffer = @end_datetime + @buffer_minutes.minutes","","      appt.scheduled_at \u003c requested_end_with_buffer &&","        appointment_end_with_buffer > @datetime","    end","  end","","  def allowed_overbooking_limit","    base_limit = @setting.allow_controlled_overbooking? ? @setting.overbooking_limit_per_slot.to_i : 0","    return base_limit unless @urgent","    return base_limit unless emergency_capacity_available?","","    [ base_limit, 1 ].max","  end","","  def emergency_capacity_available?","    day_range =  = subtotal_cents + tax_amount_cents","","    Invoice.create!(","      payment:          @payment,","      company:          @company,","      client_user:      @client,","      subtotal_cents:   subtotal_cents,","      tax_rate:         DEFAULT_TAX_RATE,","      tax_amount_cents: tax_amount_cents,","      total_cents:      total_cents,","      currency:         @payment.currency.upcase,","      issued_at:        Time.current","    )","  end","","  def generate_pdf(invoice)","    Prawn::Document.new(page_size: \"A4\", margin: [ 50, 50, 50, 50 ]) do |pdf|","      draw_header(pdf)","      pdf.move_down 20","      pdf.stroke_horizontal_rule","      pdf.move_down 15","","      draw_invoice_title(pdf, invoice)","      pdf.move_down 20","","      draw_client_block(pdf)","      pdf.move_down 20","      pdf.stroke_horizontal_rule","      pdf.move_down 15","","      draw_service_table(pdf, invoice)","      pdf.move_down 15","","      draw_totals(pdf, invoice)","      pdf.move_down 40","","      draw_footer(pdf)","    end.render","  end","","  def draw_header(pdf)","    pdf.text @company.name, size: 18, style: :bold","    pdf.move_down 4","    pdf.text @company.address, size: 9, color: \"555555\"","    pdf.text \"#{@company.zip_code} #{@company.city}\", size: 9, color: \"555555\"","    pdf.text \"SIRET : #{@company.siret}\", size: 9, color: \"555555\"","  end","","  def draw_invoice_title(pdf, invoice)","    pdf.text \"FACTURE N° #{invoice.invoice_number}\", size: 16, style: :bold, align: :right","    pdf.text \"Émise le #{invoice.issued_at.strftime('%d/%m/%Y')}\", size: 9, color: \"666666\", align: :right","    if @appointment","      pdf.text \"RDV du #{@appointment.scheduled_at.strftime('%d/%m/%Y à %H:%M')}\",","               size: 9, color: \"666666\", align: :right","    end","  end","","  def draw_client_block(pdf)","    pdf.text \"FACTURÉ À\", size: 8, style: :bold, color: \"888888\"","    pdf.move_down 4","    if @client","      pdf.text @client.full_name, size: 10, style: :bold","      pdf.text @client.email, size: 9, color: \"555555\"","    else","      pdf.text \"Client anonyme\", size: 10","    end","  end","","  def draw_service_table(pdf, invoice)","    service_name = @appointment&.service_type&.name || \"Prestation de service\"","    data = [","      [ \"Description\", \"Montant HT\" ],","      [ service_name, fmt_money(invoice.subtotal_cents, invoice.currency) ]","    ]","","    pdf.table(data, width: pdf.bounds.width, cell_style: { size: 9, padding: [ 7, 10 ] }) do","      row(0).font_style        = :bold","      row(0).background_color  = \"F0FDF4\"","      row(0).text_color        = \"166534\"","      columns(1).align         = :right","      column(0).width          = pdf.bounds.width * 0.75","    end","  end","","  def draw_totals(pdf, invoice)","    rows = [","      [ \"Sous-total HT\",                    fmt_money(invoice.subtotal_cents, invoice.currency),   false ],","      [ \"TVA #{(invoice.tax_rate * 100).to_i}%\", fmt_money(invoice.tax_amount_cents, invoice.currency), false ],","      [ \"TOTAL TTC\",                         fmt_money(invoice.total_cents, invoice.currency),     true  ]","    ]","","    rows.each do |label, value, bold|","      pdf.text \"#{label} : #{value}\",","               align:  :right,","               size:   bold ? 11 : 9,","               style:  bold ? :bold : :normal","      pdf.move_down 4","    end","  end","","  def draw_footer(pdf)","    pdf.stroke_horizontal_rule","    pdf.move_down 6","    pdf.text \"DreamAgenda • dreamagenda.fr\",","             size: 7, color: \"999999\", align: :center","    pdf.text \"Paiement effectué par carte bancaire via Stripe. TVA applicable selon la réglementation en vigueur.\",","             size: 7, color: \"aaaaaa\", align: :center","  end","","  def fmt_money(cents, currency)","    symbol = currency.upcase == \"EUR\" ? \"€\" : currency","    \"#{format('%.2f', cents / 100.0)} #{symbol}\"","  end","","  def attach_pdf(invoice, pdf_data)","    invoice.pdf.attach(","      io:           StringIO.new(pdf_data),","      filename:     \"facture-#{invoice.invoice_number}.pdf\",","      content_type: \"application/pdf\"","    )","  end","end"],"lines":[null,null,0,0,null,0,0,null,0,0,0,0,0,null,null,0,0,null,0,null,0,0,0,0,null,null,0,null,0,0,null,null,0,null,0,0,0,0,null,0,null,null,null,null,null,null,null,null,null,null,null,null,0,0,0,0,0,0,null,0,0,null,0,0,0,0,null,0,0,null,0,0,null,0,null,null,null,0,0,0,0,0,0,null,null,0,0,0,0,0,null,null,null,null,0,0,0,0,0,0,null,0,null,null,null,0,0,null,0,null,null,null,0,0,0,0,0,0,null,null,null,0,null,0,0,null,null,null,0,0,null,0,0,0,null,null,null,0,0,0,0,null,0,null,null,null,0,0,0,null,null,0,0,null,null,null,null,null,null],"lines_covered_percent":0.0,"covered_lines":0,"missed_lines":87,"omitted_lines":72,"total_lines":87},"app/services/loyalty_service.rb":{"source":["# frozen_string_literal: true","","# Service responsable de l'attribution des points de fidélité et de la","# génération automatique de codes de réduction lorsque le seuil est atteint.","class LoyaltyService","  attr_reader :errors","","  def initialize(appointment)","    @appointment = appointment","    @company     = appointment.company","    @client      = appointment.client_user","    @setting     = @company.company_setting","    @errors      = []","  end","","  # Attribue des points de fidélité après un RDV complété.","  # Vérifie si le seuil est atteint et génère un code promo le cas échéant.","  def award_points!","    return false unless eligible?","","    ActiveRecord::Base.transaction do","      create_loyalty_point!","      check_threshold_and_generate_discount!","    end","","    true","  rescue ActiveRecord::RecordInvalid => e","    @errors \u003c\u003c e.message","    false","  end","","  # Déduit les points utilisés lors de l'échange contre un code promo.","  def redeem_points!(points_to_redeem)","    return add_error(\"Points insuffisants\") unless sufficient_balance?(points_to_redeem)","","    ActiveRecord::Base.transaction do","      LoyaltyPoint.create!(","        client_user: @client,","        company:     @company,","        points:      -points_to_redeem.abs,","        reason:      \"redeemed\"","      )","    end","","    true","  rescue ActiveRecord::RecordInvalid => e","    @errors \u003c\u003c e.message","    false","  end","","  def current_balance","    LoyaltyPoint.balance_for(@client, @company)","  end","","  def progress_percentage","    return 0 unless @setting.loyalty_enabled?","    threshold = @setting.loyalty_points_threshold","    return 100 if threshold.zero?","","    [ (current_balance.to_f / threshold * 100).floor, 100 ].min","  end","","  private","","  def eligible?","    return add_error(\"Fidélité désactivée\") unless @setting.loyalty_enabled?","    return add_error(\"Client absent\") unless @client.present?","    return add_error(\"RDV non complété\") unless @appointment.completed?","    return add_error(\"Points déjà attribués\") if points_already_awarded?","","    true","  end","","  def points_already_awarded?","    LoyaltyPoint.exists?(","      appointment: @appointment,","      client_user: @client,","      company:     @company,","      reason:      \"earned\"","    )","  end","","  def create_loyalty_point!","    LoyaltyPoint.create!(","      client_user: @client,","      company:     @company,","      appointment: @appointment,","      points:      @setting.points_per_appointment,","      reason:      \"earned\"","    )","  end","","  def check_threshold_and_generate_discount!","    balance = current_balance","    threshold = @setting.loyalty_points_threshold","","    return unless threshold.positive? && balance >= threshold","","    generate_discount_code!","    deduct_threshold_points!(threshold)","    send_threshold_notification!","  end","","  def generate_discount_code!","    DiscountCode.create!(","      company:              @company,","      client_user:          @client,","      discount_type:        :fixed,","      discount_value_cents: @setting.loyalty_discount_value_cents,","      expires_at:           30.days.from_now","    )","  end","","  def deduct_threshold_points!(threshold)","    LoyaltyPoint.create!(","      client_user: @client,","      company:     @company,","      points:      -threshold,","      reason:      \"redeemed\"","    )","  end","","  def send_threshold_notification!","    ClientMailer.loyalty_threshold_reached(@client, @company).deliver_later","  end","","  def sufficient_balance?(points)","    current_balance >= points","  end","","  def add_error(message)","    @errors \u003c\u003c message","    false","  end","end"],"lines":[null,null,null,null,0,0,null,0,0,0,0,0,0,null,null,null,null,0,0,null,0,0,0,null,null,0,null,0,0,null,null,null,0,0,null,0,0,null,null,null,null,null,null,null,0,null,0,0,null,null,0,0,null,null,0,0,0,0,null,0,null,null,0,null,0,0,0,0,0,null,0,null,null,0,0,null,null,null,null,null,null,null,0,0,null,null,null,null,null,null,null,null,0,0,0,null,0,null,0,0,0,null,null,0,0,null,null,null,null,null,null,null,null,0,0,null,null,null,null,null,null,null,0,0,null,null,0,0,null,null,0,0,0,null,null],"lines_covered_percent":0.0,"covered_lines":0,"missed_lines":59,"omitted_lines":76,"total_lines":59},"app/services/medical_audit_logger.rb":{"source":["class MedicalAuditLogger","  # Logs only for healthcare companies to avoid noisy generic traces.","  def self.log!(company:, user:, action:, record:, metadata: {})","    return unless company&.healthcare_professional?","","    MedicalAuditLog.create!(","      company: company,","      user: user,","      action: action,","      record_type: record.class.name,","      record_id: record.id,","      metadata: metadata","    )","  end","end"],"lines":[0,null,0,0,null,0,null,null,null,null,null,null,null,null,null],"lines_covered_percent":0.0,"covered_lines":0,"missed_lines":4,"omitted_lines":11,"total_lines":4},"app/services/multi_booking_service.rb":{"source":["# frozen_string_literal: true","","# Service responsable de la création d'un groupe de réservation multi-prestation.","# Crée un BookingGroup + N Appointment en une seule transaction, avec vérification","# de la disponibilité globale (créneaux séquentiels sur un même employé).","class MultiBookingService","  attr_reader :booking_group, :errors","","  def initialize(company:, service_type_ids:, scheduled_at:, client_user: nil, client_notes: nil)","    @company          = company","    @service_type_ids = service_type_ids","    @scheduled_at     = scheduled_at","    @client_user      = client_user","    @client_notes     = client_notes","    @errors           = []","  end","","  def call","    return add_error(\"Sélectionnez au moins 2 prestations\") if @service_type_ids.size \u003c 2","","    @service_types = @company.service_types.active.where(id: @service_type_ids)","    return add_error(\"Prestations introuvables\") if @service_types.size != @service_type_ids.size","","    employee = find_available_employee","    return add_error(\"Aucun employé disponible pour ce créneau combiné\") unless employee","","    ActiveRecord::Base.transaction do","      create_booking_group!","      create_appointments!(employee)","    end","","    true","  rescue ActiveRecord::RecordInvalid => e","    @errors \u003c\u003c e.message","    false","  end","","  private","","  def ordered_service_types","    @ordered_service_types ||= @service_type_ids.map { |id| @service_types.find { |st| st.id == id } }","  end","","  def total_duration","    @total_duration ||= ordered_service_types.sum(&:duration_minutes)","  end","","  def total_amount_cents","    ordered_service_types.sum(&:price_cents)","  end","","  def find_available_employee","    candidates = @company.employees.active","","    # Chercher un employé compétent pour TOUTES les prestations via sous-requêtes","    # (le chaînage de joins sur la même table génère un SQL impossible)","    @service_types.each do |st|","      candidates = candidates.where(id: EmployeeSkill.where(service_type: st).select(:employee_id))","    end","","    # Vérifier la disponibilité sur la durée totale combinée","    candidates.find do |employee|","      AvailabilityChecker.new(employee, @scheduled_at, total_duration).available?","    end","  end","","  def create_booking_group!","    @booking_group = BookingGroup.create!(","      company:            @company,","      client_user:        @client_user,","      total_amount_cents: total_amount_cents,","      status:             :pending,","      client_notes:       @client_notes","    )","  end","","  def create_appointments!(employee)","    current_time = @scheduled_at","","    ordered_service_types.each do |service_type|","      @booking_group.appointments.create!(","        company:          @company,","        service_type:     service_type,","        client_user:      @client_user,","        employee:         employee,","        scheduled_at:     current_time,","        duration_minutes: service_type.duration_minutes,","        booking_source:   :online,","        status:           :pending","      )","      current_time += service_type.duration_minutes.minutes","    end","  end","","  def add_error(message)","    @errors \u003c\u003c message","    false","  end","end"],"lines":[null,null,null,null,null,0,0,null,0,0,0,0,0,0,0,null,null,0,0,null,0,0,null,0,0,null,0,0,0,null,null,0,null,0,0,null,null,0,null,0,0,null,null,0,0,null,null,0,0,null,null,0,0,null,null,null,0,0,null,null,null,0,0,null,null,null,0,0,null,null,null,null,null,null,null,null,0,0,null,0,0,null,null,null,null,null,null,null,null,null,0,null,null,null,0,0,0,null,null],"lines_covered_percent":0.0,"covered_lines":0,"missed_lines":44,"omitted_lines":55,"total_lines":44},"app/services/push_notification_service.rb":{"source":["# app/services/push_notification_service.rb","# Service pour envoyer des notifications push aux utilisateurs","# Utilisé par les contrôleurs et les jobs background","","class PushNotificationService","  # Envoyer une notification push à un utilisateur spécifique","  # @param user [User] L'utilisateur destinataire","  # @param title [String] Titre de la notification","  # @param body [String] Corps de la notification","  # @param data [Hash] Données supplémentaires à transmettre","  def self.notify_user(user:, title:, body:, data: {})","    company_id = data[:company_id]","    ","    subscriptions = if company_id","                      user.push_subscriptions.where(company_id: company_id)","                    else","                      user.push_subscriptions","                    end","","    subscriptions.each do |subscription|","      subscription.send_notification(","        title: title,","        body: body,","        data: data","      )","    end","  end","","  # Envoyer une notification push à tous les users d'une compagnie","  # @param company [Company]","  # @param users [Array\u003cUser>]","  # @param title [String]","  # @param body [String]","  # @param data [Hash]","  def self.notify_company_users(company:, users:, title:, body:, data: {})","    users.each do |user|","      notify_user(user: user, title: title, body: body, data: data.merge(company_id: company.id))","    end","  end","","  # Envoyer une notification pour un nouveau RDV créé","  # @param appointment [Appointment]","  def self.notify_new_appointment(appointment)","    title = \"Nouveau rendez-vous\"","    body = \"#{appointment.service_type.name} avec #{appointment.company.name}\"","    data = {","      url: \"/appointments/#{appointment.id}\",","      company_id: appointment.company_id,","      type: 'appointment.created'","    }","","    # Notifier tous les utilisateurs connectés à cette compagnie","    # (propriétaire + employés-utilisateurs)","    company_users = [ appointment.company.user ].compact","    if company_users.any?","      notify_company_users(","        company: appointment.company,","        users: company_users,","        title: title,","        body: body,","        data: data","      )","    end","","    # Optionnel: notifier aussi le client si app installée","    if appointment.client_user&.push_subscriptions&.any?","      notify_user(","        user: appointment.client_user,","        title: \"Confirmation RDV\",","        body: \"Votre RDV du #{appointment.scheduled_at.strftime('%d/%m à %H:%M')} est confirmé\",","        data: data","      )","    end","  end","","  # Envoyer une notification de rappel avant un RDV","  # @param appointment [Appointment]","  def self.notify_appointment_reminder(appointment)","    title = \"Rappel RDV\"","    body = \"#{appointment.service_type.name} dans #{time_until_appointment(appointment)}\"","    data = {","      url: \"/appointments/#{appointment.id}\",","      company_id: appointment.company_id,","      type: 'appointment.reminder'","    }","","    # Notifier le client","    if appointment.client_user&.push_subscriptions&.any?","      notify_user(","        user: appointment.client_user,","        title: title,","        body: body,","        data: data","      )","    end","","    # Notifier aussi les employés","    if appointment.employee&.user&.push_subscriptions&.any?","      notify_user(","        user: appointment.employee.user,","        title: title,","        body: body,","        data: data","      )","    end","  end","","  # Envoyer une notification pour un RDV annulé","  # @param appointment [Appointment]","  def self.notify_appointment_cancelled(appointment)","    title = \"RDV Annulé\"","    body = \"Votre RDV du #{appointment.scheduled_at.strftime('%d/%m à %H:%M')} a été annulé\"","    data = {","      url: \"/appointments\",","      company_id: appointment.company_id,","      type: 'appointment.cancelled'","    }","","    if appointment.client_user&.push_subscriptions&.any?","      notify_user(","        user: appointment.client_user,","        title: title,","        body: body,","        data: data","      )","    end","  end","","  # Envoyer une notification pour un paiement reçu","  # @param payment [Payment]","  def self.notify_payment_received(payment)","    title = \"Paiement reçu\"","    body = \"#{number_to_currency(payment.amount)} reçu\"","    data = {","      url: \"/invoices/#{payment.invoice_id}\",","      company_id: payment.company_id,","      type: 'payment.received'","    }","","    if payment.user&.push_subscriptions&.any?","      notify_user(","        user: payment.user,","        title: title,","        body: body,","        data: data","      )","    end","  end","","  # Envoyer une notification pour une facture générée","  # @param invoice [Invoice]","  def self.notify_invoice_generated(invoice)","    title = \"Facture générée\"","    body = \"#{invoice.invoice_number} - #{number_to_currency(invoice.total)}\"","    data = {","      url: \"/invoices/#{invoice.id}\",","      company_id: invoice.company_id,","      type: 'invoice.generated'","    }","","    invoice_users = [ invoice.company.user ].compact","    if invoice_users.any?","      notify_company_users(","        company: invoice.company,","        users: invoice_users,","        title: title,","        body: body,","        data: data","      )","    end","  end","","  # Envoyer une notification de test","  # @param user [User]","  def self.send_test_notification(user:)","    notify_user(","      user: user,","      title: \"Notification de test\",","      body: \"Les notifications push fonctionnent correctement ! ✨\",","      data: { type: 'test' }","    )","  end","","  private","","  def self.time_until_appointment(appointment)","    minutes = ((appointment.scheduled_at - Time.current) / 60).to_i","    hours = minutes / 60","    remaining_minutes = minutes % 60","","    if hours > 0","      \"#{hours}h #{remaining_minutes}min\"","    else","      \"#{remaining_minutes}min\"","    end","  end","","  def self.number_to_currency(amount)","    ActionController::Base.helpers.number_to_currency(amount / 100.0, unit: '€', locale: :fr)","  end","end"],"lines":[null,null,null,null,0,null,null,null,null,null,0,0,null,0,0,null,0,null,null,0,0,null,null,null,null,null,null,null,null,null,null,null,null,null,0,0,0,null,null,null,null,null,0,0,0,null,0,null,null,null,null,null,null,0,0,0,null,null,null,null,null,null,null,null,null,0,0,null,null,null,null,null,null,null,null,null,null,0,0,0,null,0,null,null,null,null,null,0,0,null,null,null,null,null,null,null,null,0,0,null,null,null,null,null,null,null,null,null,null,0,0,0,null,0,null,null,null,null,0,0,null,null,null,null,null,null,null,null,null,null,0,0,0,null,0,null,null,null,null,0,0,null,null,null,null,null,null,null,null,null,null,0,0,0,null,0,null,null,null,null,0,0,0,null,null,null,null,null,null,null,null,null,null,null,0,0,null,null,null,null,null,null,null,0,null,0,0,0,0,null,0,0,null,0,null,null,null,0,0,null,null],"lines_covered_percent":0.0,"covered_lines":0,"missed_lines":59,"omitted_lines":142,"total_lines":59},"app/services/sms_service.rb":{"source":["# frozen_string_literal: true","","# Wrapper Twilio pour l'envoi de SMS.","# Configure via ENV: TWILIO_ACCOUNT_SID, TWILIO_AUTH_TOKEN, TWILIO_PHONE_NUMBER","class SmsService","  # Envoie un SMS. Retourne true en cas de succès, false sinon.","  def self.send(to:, body:)","    return false unless credentials_present?","","    to_e164 = normalize_phone(to)","    return false if to_e164.nil?","","    client = Twilio::REST::Client.new(","      ENV[\"TWILIO_ACCOUNT_SID\"],","      ENV[\"TWILIO_AUTH_TOKEN\"]","    )","","    client.messages.create(","      from: ENV[\"TWILIO_PHONE_NUMBER\"],","      to:   to_e164,","      body: body","    )","    true","  rescue Twilio::REST::RestError => e","    Rails.logger.error(\"[SmsService] Twilio error: #{e.message}\")","    false","  rescue StandardError => e","    Rails.logger.error(\"[SmsService] SMS send failed: #{e.message}\")","    false","  end","","  # Normalise un numéro de téléphone vers le format E.164 (+33...)","  # Retourne nil si le form
