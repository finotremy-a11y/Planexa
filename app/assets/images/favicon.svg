<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Fond carré arrondi vert forêt -->
  <rect width="32" height="32" rx="7" fill="#2C5F2E"/>
  <!-- Engrenage simplifié en or -->
  <g fill="#B8860B">
    <!-- Corps central de l'engrenage -->
    <circle cx="16" cy="16" r="5"/>
    <!-- Dents de l'engrenage (8 dents) -->
    <rect x="14.5" y="4" width="3" height="5" rx="1.5"/>
    <rect x="14.5" y="23" width="3" height="5" rx="1.5"/>
    <rect x="4" y="14.5" width="5" height="3" rx="1.5"/>
    <rect x="23" y="14.5" width="5" height="3" rx="1.5"/>
    <rect x="7.5" y="7.5" width="3" height="5" rx="1.5"
          transform="rotate(45 9 10)"/>
    <rect x="21.5" y="7.5" width="3" height="5" rx="1.5"
          transform="rotate(-45 23 10)"/>
    <rect x="7.5" y="19.5" width="3" height="5" rx="1.5"
          transform="rotate(-45 9 22)"/>
    <rect x="21.5" y="19.5" width="3" height="5" rx="1.5"
          transform="rotate(45 23 22)"/>
  </g>
  <!-- Trou central blanc -->
  <circle cx="16" cy="16" r="2.5" fill="white"/>
</svg>
