default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  # Ou utiliser Supabase en dev :
  url: <%= ENV["DATABASE_URL"] %>

test:
  <<: *default
  # IMPORTANT: keep test DB isolated from development/production.
  # Set TEST_DATABASE_URL in your environment for safe test runs.
  url: <%= ENV["TEST_DATABASE_URL"] || ENV["DATABASE_URL"] %>

production:
  <<: *default
  url: <%= ENV["DATABASE_URL"] %>
  # Supabase pooler (transaction mode, port 6543) is not compatible with
  # PostgreSQL prepared statements across pooled connections.
  prepared_statements: false
  advisory_locks: false
  # Supabase connection pooling (port 6543) recommandé en production
  # DATABASE_URL=postgresql://postgres.[project-ref]:[password]@aws-0-eu-west-3.pooler.supabase.com:6543/postgres
